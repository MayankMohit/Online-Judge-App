worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Compress text assets. The app bundle is ~1.6 MB raw and ~0.5 MB gzipped, and
    # nothing renders until it has downloaded and executed, so this is the single
    # biggest lever on first paint (and therefore on Core Web Vitals).
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name cj.bymayank.com;

        # ACME HTTP-01 challenge. MUST stay above the redirect: Let's Encrypt
        # fetches this over plain HTTP, and a 301 to an expired-cert https would
        # defeat the very renewal that fixes the expiry. Served from a webroot
        # shared with certbot on the host (see docker-compose.yml).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
	        return 301 https://$host$request_uri;
        }
    }
	
    server {
	    listen 443 ssl;
        server_name cj.bymayank.com;

        ssl_certificate /etc/letsencrypt/live/cj.bymayank.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cj.bymayank.com/privkey.pem;

        # Security headers. `always` so they're sent on error responses too. These
        # apply to both locations below since neither redefines add_header.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Minimal CSP: block framing only (full resource CSP needs app-specific tuning).
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

	    location /api/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            # Forward the real client IP so per-IP rate limiting works (backend sets
            # `trust proxy`). Without this every request looks like it came from nginx.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Crawlers fetch this from the site root, but it is generated from the
        # database (every public problem and contest), so proxy it to the backend
        # instead of shipping a stale static file.
        location = /sitemap.xml {
            proxy_pass http://backend:5000/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Without these, the SPA fallback below answers a missing robots.txt with
        # 200 + index.html, which is worse than a clean 404: crawlers get HTML
        # where directives belong.
        location = /robots.txt {
            root      /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Filenames are content-hashed, so a cached copy can never go stale.
        # `expires` rather than `add_header Cache-Control` on purpose: add_header
        # in a location replaces the inherited set, which would silently drop the
        # security headers declared above.
        location /assets/ {
            root    /usr/share/nginx/html;
            expires 1y;
        }

        # The shell is NOT hashed and names the current asset bundle, so it must
        # be revalidated or clients pin themselves to a stale deploy.
        location = /index.html {
            root    /usr/share/nginx/html;
            expires -1;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
